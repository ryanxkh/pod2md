name: Build RunPod Worker

# Builds the GPU worker image on a native amd64 runner (no Mac emulation) and
# pushes it to GHCR. Triggers on changes to runpod-worker/, or run it manually
# from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - 'runpod-worker/**'
      - '.github/workflows/runpod-worker.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/pod2md-worker

jobs:
  build:
    runs-on: ubuntu-latest # native linux/amd64 — what RunPod GPUs run
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: runpod-worker
          file: runpod-worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # Passed to the Dockerfile's `--mount=type=secret,id=HF_TOKEN` step
          # for baking the gated pyannote model. Set it once with:
          #   gh secret set HF_TOKEN --repo ryanxkh/pod2md
          secrets: |
            HF_TOKEN=${{ secrets.HF_TOKEN }}
          # Layer cache across runs, so unchanged steps are instant
          cache-from: type=gha
          cache-to: type=gha,mode=max
